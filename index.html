<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NightFlix</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#eee;font-family:Arial,sans-serif}
header{padding:22px 18px;text-align:center;background:linear-gradient(180deg,#11131b,#08090d)}
h1{margin:0 0 14px;font-size:30px}.sub{color:#9da3b0;font-size:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
input,select{background:#151821;color:#fff;border:1px solid #292e3a;border-radius:10px;padding:11px 13px;outline:none}
main{max-width:1200px;margin:auto;padding:22px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#11131a;border:1px solid #20232d;border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#3b4252}
.thumb{aspect-ratio:16/9;background:#050609;position:relative;overflow:hidden}
.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;text-shadow:0 2px 12px #000;pointer-events:none}
.info{padding:12px}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:7px;color:#8f96a4;font-size:12px}
.empty{text-align:center;color:#888;padding:50px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:10;padding:20px}
.modal.show{display:flex;align-items:center;justify-content:center}
.playerbox{width:min(1000px,100%);position:relative}
.close{position:absolute;right:0;top:-42px;border:0;background:none;color:#fff;font-size:32px;cursor:pointer}
.driveframe{width:100%;height:min(70vh,650px);border:0;border-radius:10px;background:#000}
.note{color:#8f96a4;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>🌙 NightFlix</h1>
  <div class="sub">Your personal video library</div>
  <div class="controls">
    <input id="search" placeholder="Search videos...">
    <select id="category"><option value="all">All categories</option></select>
  </div>
</header>

<main><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">No videos found.</div></main>

<div id="modal" class="modal">
  <div class="playerbox">
    <button class="close" id="close">×</button>
    <iframe id="frame" class="driveframe"
      allow="autoplay; fullscreen"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="note">Playing through Google Drive's built-in viewer.</div>
  </div>
</div>

<script>
let videos=[];
const grid=document.getElementById('grid');
const empty=document.getElementById('empty');
const search=document.getElementById('search');
const category=document.getElementById('category');
const modal=document.getElementById('modal');
const frame=document.getElementById('frame');

function fileId(url){
  if(!url) return '';
  let m=url.match(/\/d\/([^/?]+)/);
  if(m) return m[1];
  m=url.match(/[?&]id=([^&]+)/);
  return m ? m[1] : '';
}
function previewUrl(url){
  const id=fileId(url);
  return id ? `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview` : '';
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function render(){
  const q=search.value.toLowerCase().trim();
  const cat=category.value;
  const list=videos.filter(v=>{
    const okQ=!q || `${v.title||''} ${v.description||''}`.toLowerCase().includes(q);
    const okC=cat==='all' || (v.category||'Other')===cat;
    return okQ && okC;
  });
  grid.innerHTML=list.map((v,i)=>{
    const id=fileId(v.url);
    return `<article class="card" data-index="${videos.indexOf(v)}">
      <div class="thumb">
        ${id ? `<iframe loading="lazy" src="${previewUrl(v.url)}" style="width:100%;height:100%;border:0;pointer-events:none" allow="autoplay"></iframe>` : ''}
        <div class="play">▶</div>
      </div>
      <div class="info">
        <div class="title">${escapeHtml(v.title || 'Untitled Video')}</div>
        <div class="meta">${escapeHtml(v.category || 'Other')}${v.year ? ' • '+escapeHtml(v.year):''}</div>
      </div>
    </article>`;
  }).join('');
  empty.style.display=list.length?'none':'block';
  grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openVideo(videos[+c.dataset.index]));
}
function openVideo(v){
  const url=previewUrl(v.url);
  if(!url) return alert('Invalid Google Drive link.');
  frame.src=url;
  modal.classList.add('show');
}
function closeVideo(){
  modal.classList.remove('show');
  frame.src='about:blank';
}
search.oninput=render;
category.onchange=render;
document.getElementById('close').onclick=closeVideo;
modal.onclick=e=>{if(e.target===modal)closeVideo()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});

fetch('videos/videos.json')
 .then(r=>r.json())
 .then(d=>{
   videos=Array.isArray(d)?d:[];
   [...new Set(videos.map(v=>v.category||'Other'))].sort().forEach(c=>{
     const o=document.createElement('option');o.value=c;o.textContent=c;category.appendChild(o);
   });
   render();
 })
 .catch(()=>{empty.textContent='Could not load videos/videos.json';empty.style.display='block'});
</script>
</body>
</html>
